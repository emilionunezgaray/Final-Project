<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Movie Theater Billboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Movie Theater Billboard</h1>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search by title..." />
    <select id="genreFilter">
      <option value="">All Genres</option>
      <option value="Action">Action</option>
      <option value="Comedy">Comedy</option>
      <option value="Drama">Drama</option>
      <option value="Science Fiction">Science Fiction</option>
    </select>
    <input type="number" id="priceFilter" placeholder="Max price" />
    <input type="time" id="timeFilter" />
    <button id="applyFiltersBtn">Apply Filters</button>
  </div>

  <div id="movie-container" class="movie-container"></div>

  <!-- Booking Modal -->
  <div id="bookingModal" class="modal">
    <div class="modal-content">
      <span class="close-button" id="closeModal">&times;</span>
      <h2 id="bookingTitle">Book Seats</h2>
      <div class="seat-map" id="seatMap"></div>
      <p id="selectedSeats">Selected Seats: None</p>
      <p id="totalPrice">Total Price: 0$</p>
      <button id="confirmBookingBtn">Confirm Booking</button>
    </div>
  </div>

  <script type="module" src="ui.js"></script>
</body>
</html>
