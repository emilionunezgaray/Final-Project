<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Movie Theater Billboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Movie Theater Billboard</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <aside>
    <form class="controls" id="filtersForm">
      <input type="text" id="searchInput" placeholder="Search by title..." />
      <select id="genreFilter">
        <option value="">All Genres</option>
        <option value="Action">Action</option>
        <option value="Comedy">Comedy</option>
        <option value="Drama">Drama</option>
        <option value="Science Fiction">Science Fiction</option>
      </select>
      <input type="number" id="priceFilter" placeholder="Max price" />
      <input type="time" id="timeFilter"/>
      <button type="sumbit" id="applyFiltersBtn">Apply Filters</button>
      <button type="reset" id="resetFiltersBtn">Reset Filters</button>
    </form>
  </aside>

  <section id="movies">
    <ul id="movie-container" class="movie-container"></ul>
  </section>

  <section id="favorites-section">
    <h2>Favorites</h2>
    <div id="favorites" class="drop-zone">
      <p>Drag movies here to add them to your favorites</p>
    </div>
  </section>


  <!-- Booking Modal -->
  <div id="bookingModal" class="modal">
    <div class="modal-content">
      <span class="close-button" id="closeModal">&times;</span>
      <h2 id="bookingTitle">Book Seats</h2>
      <div class="seat-map" id="seatMap"></div>
      <p id="selectedSeats">Selected Seats: None</p>
      <p id="totalPrice">Total Price: 0$</p>
      <button id="confirmBookingBtn">Confirm Booking</button>
    </div>
  </div>

  <script type="module" src="ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
 
  <footer class="site-footer">
    <div class="footer-content">
      <div class="footer-section">
        <h4>Quick Links</h4>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="movies.html">Movies</a></li>
          <li><a href="bookings.html">Bookings</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2025 Movie Theater.</p>
    </div>
  </footer> 
</body>
</html>
